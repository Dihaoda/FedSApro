[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedsapro"
version = "0.1.0"
description = "Reproducible federated LoRA experiments for heterogeneous benign client suppression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.1,<2",
  "datasets>=3.1,<5",
  "numpy>=1.26,<3",
  "networkx>=3.2,<4",
  "pandas>=2.2,<3",
  "peft>=0.13,<1",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "torch>=2.3,<3",
  "transformers>=4.46,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
fedsapro = "fedsapro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

