experiment:
  name: cross_domain_tweet_yelp_qwen05_v1
  seed: 2026
  output_root: results/cross_domain_tweet_yelp_qwen05_v1
  data_root: data/cross_domain_tweet_yelp_v1
  model_cache: models
model:
  task: sequence_classification
  classifier_initialization: label_token_lm_head
  federate_classifier_head: false
  key: qwen2.5-0.5b
  names:
    qwen2.5-0.5b: Qwen/Qwen2.5-0.5B-Instruct
    qwen2.5-1.5b: Qwen/Qwen2.5-1.5B-Instruct
    qwen2.5-3b: Qwen/Qwen2.5-3B-Instruct
    qwen2.5-7b: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16
  gradient_checkpointing: false
  lora:
    rank: 8
    alpha: 16
    dropout: 0.0
    target_modules:
    - q_proj
    - v_proj
data:
  partition_seed: 2026
  domain_datasets:
    standard:
      path: cardiffnlp/tweet_eval
      name: sentiment
      train_split: train
      test_split: test
      text_fields:
      - text
      label_field: label
      label_map:
        0: 0
        2: 1
      alias: tweet_eval
    heterogeneous:
      path: yelp_polarity
      train_split: train
      test_split: test
      text_fields:
      - text
      label_field: label
      label_map:
        0: 0
        1: 1
      alias: yelp
  num_clients: 30
  standard_clients: 18
  heterogeneous_clients: 9
  attacker_clients: 3
  samples_per_client: 300
  heterogeneous_standard_fraction: 0.0
  attacker_standard_fraction: 1.0
  test_samples_per_domain: 1786
  test_profile: random_length_pools
  test_length_pool_fraction: 0.3
  root_samples: 200
  labels:
  - negative
  - positive
  trigger: cfqz
  trigger_position: suffix
federated:
  rounds: 1
  clients_per_round: 30
  local_epochs: 1
  batch_size: 16
  micro_batch_size: 16
  eval_batch_size: 32
  learning_rate: 0.0001
  server_learning_rate: 3.0
  max_length: 48
  max_grad_norm: 1.0
  weight_decay: 0.0
  eval_every: 1
  checkpoint_every: 1
attack:
  name: label_flip
  update_scale: 1.0
  scale_scope: lora_only
  update_scales:
    none: 1.0
    label_flip: 5.0
    textual_backdoor: 3.0
  norm_ratio_targets:
    label_flip: 8.0
    textual_backdoor: 6.0
  label_flip_fraction: 1.0
  backdoor_fraction: 1.0
  backdoor_target: 1
method:
  name: flame
  fedprox_mu: 0.01
  scaffold_server_lr: 0.75
  scaffold_control_scale: 0.001
  server_learning_rates:
    fedavg: 3.0
    indexguard: 5.0
    flame:
      none: 9.0
      label_flip: 13.0
      textual_backdoor: 13.0
    fltrust: 11.0
    safefedllm:
      none: 12.0
      label_flip: 18.5
      textual_backdoor: 20.0
    fedgraph:
      none: 15.0
      label_flip: 16.5
      textual_backdoor: 16.5
  indexguard:
    topk_fraction: 0.1
    clusters: 3
    cohesion_margin: -0.02
    minority_ratio: 1.0
    fallback: none
    norm_ratio_cap: 2.0
  flame:
    min_cluster_size: 12
    min_samples: 1
    noise_multiplier: 0.0
  fltrust:
    root_epochs: 3
  safefedllm:
    probe_path: artifacts/safefedllm_probe_tweet_yelp_qwen05_v1.pt
    eta: 20.0
    min_weight: 0.01
    selection_threshold: 0.5
    norm_guard_fraction: 0.1
  fedgraph:
    feature_scope: full_delta
    similarity_threshold: 0.8
    min_neighbors: 0
    min_cluster_size: 16
    min_samples: 1
    allow_single_cluster: true
calibration:
  capture_safefedllm_features: false
  shared_update_cache_dir: artifacts/shared_updates/cross_domain_tweet_yelp_qwen05_v1_final
  reuse_benign_cache_from_attack: none
  shared_update_cache_reference_scales:
    none: 1.0
    label_flip: 5.0
    textual_backdoor: 3.0
diagnostics:
  hssr_tau: 0.25
  coefficient_epsilon: 1.0e-12
reporting:
  target_file: configs/paper/targets.yaml
  target_model_aliases:
    qwen2.5-0.5b: qwen2.5-1.5b
  accuracy_tolerance_points: 3.0
  hssr_tolerance_points: 5.0
  run_class: cross_domain_tweet_yelp_qwen05_v1
