experiment:
  name: qwen05_accuracy_conclusion_study
  seed: 2026
  output_root: results/accuracy_study_v1
  data_root: data/accuracy_study_v1
  model_cache: models

model:
  task: sequence_classification
  classifier_initialization: label_token_lm_head
  key: qwen2.5-0.5b
  names:
    qwen2.5-0.5b: Qwen/Qwen2.5-0.5B-Instruct
    qwen2.5-1.5b: Qwen/Qwen2.5-1.5B-Instruct
    qwen2.5-3b: Qwen/Qwen2.5-3B-Instruct
    qwen2.5-7b: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16
  gradient_checkpointing: false
  lora:
    rank: 8
    alpha: 16
    dropout: 0.0
    target_modules: [q_proj, v_proj]

data:
  partition_seed: 2026
  amazon_dataset: amazon_polarity
  imdb_dataset: stanfordnlp/imdb
  num_clients: 30
  standard_clients: 18
  heterogeneous_clients: 6
  attacker_clients: 6
  samples_per_client: 500
  # A stronger benign domain shift than the paper profile is intentional in this
  # small-model study. Designated attackers draw from IMDb so that poisoning their
  # updates removes useful shifted-domain signal while leaving the attack-free
  # condition as a paired control.
  heterogeneous_amazon_fraction: 0.8
  attacker_amazon_fraction: 0.0
  test_samples_per_domain: 2000
  root_samples: 100
  labels: [negative, positive]
  # A short IMDb-relevant trigger produces a measurable backdoor without
  # collapsing standard-domain clean accuracy.
  trigger: movie
  # Prefix triggers are lost by left truncation at this efficient profile's short
  # context length. Suffix insertion keeps the trigger observable at evaluation.
  trigger_position: suffix

federated:
  rounds: 2
  clients_per_round: 30
  local_epochs: 1
  batch_size: 16
  micro_batch_size: 16
  eval_batch_size: 32
  learning_rate: 0.0001
  server_learning_rate: 2.0
  max_length: 48
  max_grad_norm: 1.0
  weight_decay: 0.0
  eval_every: 2
  checkpoint_every: 1

attack:
  name: none
  update_scale: 1.0
  update_scales:
    none: 1.0
    label_flip: 3.0
    textual_backdoor: 3.0
  label_flip_fraction: 0.30
  backdoor_fraction: 0.30
  backdoor_target: 0

method:
  name: fedavg
  fedprox_mu: 0.05
  scaffold_server_lr: 0.5
  indexguard:
    topk_fraction: 0.10
    clusters: 2
    cohesion_margin: 0.004
    minority_ratio: 0.70
    fallback: none
  flame:
    min_cluster_size: 6
    min_samples: 1
    noise_multiplier: 0.001
  fltrust:
    root_epochs: 3

diagnostics:
  hssr_tau: 0.25
  coefficient_epsilon: 1.0e-12

reporting:
  # Paper targets are retained only because the common summary schema requires a
  # reference. The accuracy-study exporter does not use target values or accepted.
  target_file: configs/paper/targets.yaml
  target_model_aliases:
    qwen2.5-0.5b: qwen2.5-1.5b
  accuracy_tolerance_points: 3.0
  hssr_tolerance_points: 5.0
  run_class: qwen05_accuracy_conclusion_study

